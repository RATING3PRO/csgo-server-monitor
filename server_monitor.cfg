// CSGO Server Monitor 配置文件
// 此文件会在插件首次加载时自动生成
// 位置: csgo/cfg/sourcemod/server_monitor.cfg

// ============================================
// 基础设置
// ============================================

// 监控数据更新间隔（秒）
// 默认: 5.0
// 最小: 1.0, 最大: 60.0
// 说明: 更新间隔越短，数据越实时，但会增加服务器负载
//       推荐值：
//       - 高性能服务器 (128 tick): 3.0
//       - 普通服务器 (64 tick): 5.0
//       - 低配置服务器: 10.0
sm_monitor_interval "5.0"

// 启用服务器监控
// 默认: 1
// 0 = 禁用, 1 = 启用
// 说明: 设置为 0 将完全禁用监控功能
sm_monitor_enable "1"

// ============================================
// 性能警告阈值（未来版本功能）
// ============================================

// CPU 使用率警告阈值（百分比）
// sm_monitor_cpu_warning "80.0"

// 内存使用警告阈值（MB）
// sm_monitor_memory_warning "2048.0"

// 服务器方差警告阈值（毫秒）
// sm_monitor_var_warning "5.0"

// 玩家延迟警告阈值（毫秒）
// sm_monitor_ping_warning "200"

// ============================================
// 显示设置（未来版本功能）
// ============================================

// 在聊天窗口显示服务器状态
// sm_monitor_chat_display "1"

// 聊天显示间隔（秒）
// sm_monitor_chat_interval "300"

// HUD 显示位置
// 0 = 禁用, 1 = 左上, 2 = 右上, 3 = 中央
// sm_monitor_hud_position "0"

// ============================================
// 日志设置（未来版本功能）
// ============================================

// 记录服务器状态到日志
// sm_monitor_log_enable "1"

// 日志记录间隔（秒）
// sm_monitor_log_interval "60"

// 日志文件路径
// sm_monitor_log_path "logs/server_monitor.log"

// ============================================
// 数据库设置（未来版本功能）
// ============================================

// 启用数据库存储
// sm_monitor_database_enable "0"

// 数据库配置名称（在 databases.cfg 中定义）
// sm_monitor_database_config "server_monitor"

// 数据保留天数
// sm_monitor_database_retention "30"

// ============================================
// API 设置（未来版本功能）
// ============================================

// 启用 Web API
// sm_monitor_api_enable "0"

// API 端口
// sm_monitor_api_port "8080"

// API 密钥
// sm_monitor_api_key "your_secret_key_here"

// ============================================
// 地理位置设置
// ============================================

// 启用地理位置查询
// sm_monitor_geoip_enable "1"

// 缓存地理位置信息（减少查询次数）
// sm_monitor_geoip_cache "1"

// ============================================
// 权限设置
// ============================================

// 允许普通玩家使用 sm_status 命令
// sm_monitor_allow_status "1"

// 允许普通玩家使用 sm_players 命令
// sm_monitor_allow_players "1"

// ============================================
// 高级设置
// ============================================

// 调试模式（输出详细日志）
// sm_monitor_debug "0"

// 使用系统扩展获取 CPU/内存信息
// sm_monitor_use_system_extension "1"

// ============================================
// 说明
// ============================================
// 
// 修改此文件后，需要重新加载插件：
// 方法1: sm plugins reload server_monitor
// 方法2: 重启服务器

